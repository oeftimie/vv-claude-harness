<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vv-harness dashboard</title>
<!--
  Dashboard frontend (F091): a single HTML page, served by F090's
  hooks/dashboard/serve.py, rendering a live node-graph / org-chart view of
  one harness session. Connects to GET /events on load (F090's real SSE
  endpoint: `data: <raw JSON line>` blocks, backlog replayed first, then
  live events -- no custom `event:` type, so event kind is read from each
  payload's own hook_event_name field).

  Classification rule (F091, grounded in F088's notes -- see that feature's
  quoted platform doc excerpt): any event WITHOUT agent_id belongs to the
  lead (the center node); any event WITH agent_id belongs to that agent_id's
  own spoke. Flat by design -- there is no parent-agent field in the hook
  payload set, so spawn ancestry cannot be reconstructed. A gate or
  permission event with no agent_id attaches to the lead's own badge, using
  the same rule.

  Node labels: agent_type only, NEVER teammate_name (no documented
  correlation between tool-activity identity and Agent-Teams identity -- see
  F088's notes). A node whose agent_type is missing is labeled
  "(unknown agent)".

  QA binding: manual (see this repo's .harness/features.json F091 entry).
  This repo's dependency-free bash/python3 test runner has no browser/DOM
  harness; test/run-tests.sh adds only supplementary structural assertions
  (vendored animejs file present/non-empty/labeled, and this page's source
  containing the required event-type handler strings).

  Session picker (F099): the page no longer guesses which session log to
  tail. On load it fetches GET /sessions (F090) and shows every log under
  the server's bound project, plus that project's own path -- a server
  reused across projects (SKILL.md step 2's "Accepted limitation") is now
  visible in this list instead of silently rendering someone else's
  session. Connecting only happens when the user clicks Watch, against
  /events?session=<id> (F090's per-connection override), never an
  auto-selected default.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #12141a;
    --panel: #1b1e27;
    --border: #333748;
    --text: #e8e9ee;
    --lead: #4f7cff;
    --agent: #35c19f;
    --judge: #b163ff;
    --gate: #ffb454;
    --permission: #ff5c7a;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
  }
  #picker-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px;
    box-sizing: border-box;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  #picker-project {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    opacity: 0.75;
  }
  #picker-select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    max-width: 320px;
  }
  #picker-bar button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #picker-bar button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #graph {
    position: relative;
    width: 100%;
    height: calc(100vh - 44px);
    overflow: hidden;
  }
  #spokes {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
  }
  .node {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Centering offset lives on the standalone CSS `translate` property,
       never on `transform` -- anime.js v3 parses an element's existing
       `transform` string into a Map keyed by function name (see
       vendor/anime.min.js's W()) and rewrites the whole thing from that
       Map on every animated frame. `translate` is a distinct CSS property
       it never reads or writes, so this offset survives animateIn()/
       pulse() untouched. Percentage-based like the old transform trick,
       so it stays correct regardless of the node's actual rendered size.
       Applies to every node with class "node", so .node.lead (no other
       centering rule of its own) is centered by this same rule too. */
    translate: -50% -50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 84px;
    min-height: 84px;
    padding: 8px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--border);
    text-align: center;
    box-sizing: border-box;
  }
  .node.lead {
    width: 120px;
    height: 120px;
    min-width: 120px;
    min-height: 120px;
    border-color: var(--lead);
    box-shadow: 0 0 18px rgba(79, 124, 255, 0.35);
    z-index: 2;
  }
  .node.agent {
    border-color: var(--agent);
    opacity: 0;
    z-index: 1;
  }
  .node.judge {
    border-color: var(--judge);
    box-shadow: 0 0 12px rgba(177, 99, 255, 0.35);
  }
  .node .label {
    font-size: 11px;
    line-height: 1.3;
    word-break: break-word;
  }
  .badges {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 8px;
    color: #12141a;
    font-weight: 600;
  }
  /* Gate verdict badges: keyed by both the gate AND the verdict
     (gateBadgeKind() below), not verdict alone -- addBadge() reuses an
     existing element by DOM lookup on its kind string, so a shared
     per-verdict kind let two different gate scripts logging the same
     verdict in one session (e.g. enforce-scope's allow and commit-gate's
     allow) silently overwrite each other's title/finding. The attribute
     selector is the default look for any gate/verdict pair (matches the
     old shared amber styling); the block/skipped rules override it via a
     suffix selector on the verdict, so they apply regardless of which
     gate produced it, using equal specificity so source order (below)
     decides. */
  .badge[class*="badge-gate-"] { background: var(--gate); }
  .badge[class*="badge-gate-"][class$="-block"] { background: var(--permission); color: #fff; }
  .badge[class*="badge-gate-"][class$="-skipped"] { background: var(--border); color: var(--text); }
  .badge-judge { background: var(--judge); color: #fff; }
  .badge-permission { background: var(--permission); color: #fff; }
</style>
</head>
<body>
<div id="picker-bar">
  <span id="picker-project">Project: (loading...)</span>
  <select id="picker-select" hidden></select>
  <span id="picker-empty" hidden>No sessions yet -- start a Claude Code session with VV_HARNESS_DASHBOARD=1 set.</span>
  <button id="picker-watch" type="button" disabled>Watch</button>
  <button id="picker-refresh" type="button">Refresh</button>
</div>
<div id="graph">
  <div id="spokes"></div>
  <div id="lead-node" class="node lead">
    <div class="label" id="lead-label">lead</div>
    <div class="badges" id="lead-badges"></div>
  </div>
</div>

<script src="vendor/anime.min.js"></script>
<script>
(function () {
  "use strict";

  // Layout: up to RING1_MAX spokes share a single ring around the lead;
  // beyond that, overflow spokes degrade to a second, wider ring rather
  // than becoming illegible.
  var RING1_MAX = 12;
  var RING1_RADIUS = 220;
  var RING2_RADIUS = 340;

  var spokesEl = document.getElementById("spokes");
  var leadNodeEl = document.getElementById("lead-node");
  var leadBadgesEl = document.getElementById("lead-badges");

  var pickerProjectEl = document.getElementById("picker-project");
  var pickerSelectEl = document.getElementById("picker-select");
  var pickerEmptyEl = document.getElementById("picker-empty");
  var pickerWatchEl = document.getElementById("picker-watch");
  var pickerRefreshEl = document.getElementById("picker-refresh");

  // agent_id -> { agentType, el, labelEl, badgesEl, isJudge }
  var agents = {};

  function agentOrder() {
    return Object.keys(agents);
  }

  function positionRing(ids, radius) {
    var n = ids.length;
    if (n === 0) return;
    for (var i = 0; i < n; i++) {
      var angle = (2 * Math.PI * i) / n - Math.PI / 2;
      var x = radius * Math.cos(angle);
      var y = radius * Math.sin(angle);
      var rec = agents[ids[i]];
      if (!rec) continue;
      // Ring position is off `transform` entirely -- anime.js v3 rebuilds
      // the whole transform string from its own internal snapshot on every
      // animated frame (pulse() at 280ms, or layoutSpokes() firing mid-
      // animation on node create/remove), so a direct style.transform write
      // here would be silently clobbered until the next full layout pass.
      // x/y are stored on the node record and applied via style.left/top
      // using calc() off the CSS-declared 50%/50% base, leaving `transform`
      // owned exclusively by anime.js for scale/opacity.
      rec.x = x;
      rec.y = y;
      rec.el.style.left = "calc(50% + " + x + "px)";
      rec.el.style.top = "calc(50% + " + y + "px)";
    }
  }

  function layoutSpokes() {
    var ids = agentOrder();
    var ring1 = ids.slice(0, RING1_MAX);
    var ring2 = ids.slice(RING1_MAX);
    positionRing(ring1, RING1_RADIUS);
    positionRing(ring2, RING2_RADIUS);
  }

  function labelFor(agentType) {
    // Node labels are agent_type only, NEVER teammate_name -- there is no
    // documented correlation between tool-activity identity (agent_id/
    // agent_type) and Agent-Teams identity (teammate_name/team_name).
    return agentType || "(unknown agent)";
  }

  function isJudgeType(agentType) {
    return typeof agentType === "string" && agentType.endsWith("-judge");
  }

  function markAsJudge(rec) {
    if (rec.isJudge) return;
    rec.isJudge = true;
    rec.el.classList.add("judge");
    addBadge(rec.badgesEl, "judge", "JUDGE");
  }

  function addBadge(badgesEl, kind, text) {
    var selector = ".badge-" + kind;
    var el = badgesEl.querySelector(selector);
    if (!el) {
      el = document.createElement("span");
      el.className = "badge badge-" + kind;
      badgesEl.appendChild(el);
    }
    el.textContent = text;
    if (window.anime) {
      window.anime({
        targets: el,
        scale: [0.4, 1],
        opacity: [0, 1],
        duration: 260,
        easing: "easeOutBack"
      });
    }
    return el;
  }

  function getOrCreateAgentNode(agentId, agentType) {
    var rec = agents[agentId];
    if (rec) {
      if (agentType && !rec.agentType) {
        rec.agentType = agentType;
        rec.labelEl.textContent = labelFor(agentType);
        if (isJudgeType(agentType)) markAsJudge(rec);
      }
      return rec;
    }

    var el = document.createElement("div");
    el.className = "node agent";

    var labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = labelFor(agentType);
    el.appendChild(labelEl);

    var badgesEl = document.createElement("div");
    badgesEl.className = "badges";
    el.appendChild(badgesEl);

    spokesEl.appendChild(el);

    rec = { agentType: agentType || null, el: el, labelEl: labelEl, badgesEl: badgesEl, isJudge: false, x: 0, y: 0 };
    agents[agentId] = rec;

    if (isJudgeType(agentType)) markAsJudge(rec);

    layoutSpokes();
    animateIn(rec);
    return rec;
  }

  function animateIn(rec) {
    // Nodes animate in on SubagentStart. A node created defensively by
    // some other event carrying agent_id (out-of-order/replayed backlog)
    // still gets this same entrance animation so it never sits invisible.
    if (window.anime) {
      window.anime({
        targets: rec.el,
        opacity: [0, 1],
        scale: [0.3, 1],
        duration: 420,
        easing: "easeOutElastic(1, .6)"
      });
    } else {
      rec.el.style.opacity = "1";
    }
  }

  function animateOutAndRemove(agentId) {
    var rec = agents[agentId];
    if (!rec) return;
    delete agents[agentId];
    var el = rec.el;
    var onDone = function () {
      if (el.parentNode) el.parentNode.removeChild(el);
      layoutSpokes();
    };
    if (window.anime) {
      window.anime({
        targets: el,
        opacity: [1, 0],
        scale: [1, 0.3],
        duration: 320,
        easing: "easeInQuad",
        complete: onDone
      });
    } else {
      onDone();
    }
  }

  function pulse(el) {
    if (!window.anime) return;
    window.anime({
      targets: el,
      scale: [1, 1.18, 1],
      duration: 280,
      easing: "easeInOutQuad"
    });
  }

  var leadNode = { el: leadNodeEl, badgesEl: leadBadgesEl };

  function sanitizeClassFragment(value) {
    // Safe class-name fragment for data from a hook payload, not a fixed
    // enum this page controls.
    return String(value || "unknown")
      .toLowerCase()
      .replace(/[^a-z0-9_-]/g, "-");
  }

  function gateBadgeKind(gate, verdict) {
    // Each (gate, verdict) pair gets its own badge kind ("gate-commit-gate-
    // block", "gate-enforce-scope-allow", ...) so addBadge()'s reuse-by-
    // lookup never lets one gate's verdict badge silently overwrite a
    // different gate's -- keying on verdict alone let enforce-scope's
    // allow/skipped and commit-gate's allow (both logged on nearly every
    // tool call) repeatedly clobber each other's title/finding even though
    // they came from different gate scripts.
    return "gate-" + sanitizeClassFragment(gate) + "-" + sanitizeClassFragment(verdict);
  }

  function handleGateEvent(payload, node) {
    // Quality-gate hooks (F089): a gate/verdict/finding-bearing log line.
    var text = "GATE:" + (payload.verdict || "?");
    var badgeEl = addBadge(node.badgesEl, gateBadgeKind(payload.gate, payload.verdict), text);
    badgeEl.title = payload.gate + (payload.finding ? ": " + payload.finding : "");
  }

  function handlePermissionEvent(node, hookEventName) {
    var text = hookEventName === "PermissionDenied" ? "DENIED" : "REQUEST";
    addBadge(node.badgesEl, "permission", text);
  }

  function handleEvent(payload) {
    if (!payload || typeof payload !== "object") return;
    var hookEventName = payload.hook_event_name;
    var agentId = payload.agent_id || null;
    var agentType = payload.agent_type || null;

    var node = agentId ? getOrCreateAgentNode(agentId, agentType) : leadNode;

    switch (hookEventName) {
      case "SubagentStart":
        // getOrCreateAgentNode() above already called animateIn() when it
        // created this node for the first time -- whether that happened
        // via this very SubagentStart event, or earlier via some other
        // event carrying the same agent_id (out-of-order/replayed
        // backlog; see animateIn()'s own comment). Every node passes
        // through that single creation path exactly once, so calling
        // animateIn() again here would double the entrance animation.
        break;
      case "SubagentStop":
        if (agentId) animateOutAndRemove(agentId);
        break;
      case "PreToolUse":
      case "PostToolUse":
        pulse(node.el);
        break;
      case "PermissionRequest":
      case "PermissionDenied":
        handlePermissionEvent(node, hookEventName);
        break;
      default:
        break;
    }

    // A gate/verdict/finding-bearing line (F089) is identified by payload
    // shape, not hook_event_name, since gate scripts log it alongside
    // whatever hook_event_name triggered them (commonly PreToolUse).
    if (payload.gate) {
      handleGateEvent(payload, node);
    }
  }

  var currentSource = null;

  function resetGraph() {
    // Switching sessions must not blend the previous session's spokes into
    // the new one -- drop every tracked agent and its DOM node, and clear
    // whatever badges the lead picked up (e.g. a stale gate/permission
    // badge from the session just left behind).
    agents = {};
    while (spokesEl.firstChild) spokesEl.removeChild(spokesEl.firstChild);
    leadBadgesEl.innerHTML = "";
  }

  function connect(sessionId) {
    // sessionId is always explicit here (F099) -- the picker below is the
    // only caller, and it never invokes this before the user has chosen a
    // session from GET /sessions. No bare "/events" auto-select fallback:
    // guessing which log to tail is exactly what this feature removes.
    if (currentSource) currentSource.close();
    resetGraph();
    var url = sessionId ? "/events?session=" + encodeURIComponent(sessionId) : "/events";
    currentSource = new EventSource(url);
    currentSource.onmessage = function (evt) {
      var payload;
      try {
        payload = JSON.parse(evt.data);
      } catch (err) {
        return;
      }
      handleEvent(payload);
    };
    // EventSource retries the connection itself on a drop; this is native
    // reconnection behavior, not app-level polling -- F090's backlog
    // replay on (re)connect is the sole catch-up path either way.
  }

  function populateSessions(data) {
    pickerProjectEl.textContent = "Project: " + (data.project || "(unknown)");
    var sessions = data.sessions || [];
    var previousValue = pickerSelectEl.value;

    pickerSelectEl.innerHTML = "";
    sessions.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.session_id;
      opt.textContent = s.session_id;
      pickerSelectEl.appendChild(opt);
    });

    var hasSessions = sessions.length > 0;
    pickerSelectEl.hidden = !hasSessions;
    pickerEmptyEl.hidden = hasSessions;
    pickerWatchEl.disabled = !hasSessions;

    if (!hasSessions) return;
    // Refreshing keeps the current selection if it's still listed (the
    // user may be mid-review of a session that's no longer the newest);
    // otherwise falls back to the most-recently-modified entry, which
    // GET /sessions always returns first (F090's list_sessions()).
    var stillListed = sessions.some(function (s) { return s.session_id === previousValue; });
    pickerSelectEl.value = stillListed ? previousValue : sessions[0].session_id;
  }

  function loadSessions() {
    fetch("/sessions")
      .then(function (resp) { return resp.json(); })
      .then(populateSessions)
      .catch(function () {
        pickerProjectEl.textContent = "Project: (failed to load session list)";
      });
  }

  pickerWatchEl.addEventListener("click", function () {
    if (pickerSelectEl.value) connect(pickerSelectEl.value);
  });
  pickerRefreshEl.addEventListener("click", loadSessions);

  loadSessions();
})();
</script>
</body>
</html>
