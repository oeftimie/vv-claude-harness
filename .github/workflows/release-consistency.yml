name: release-consistency

on:
  push:
    branches: [main]
    tags: ['v*']
    # GitHub does not evaluate path filters for tag pushes. Tags therefore keep
    # running the full check, while ordinary main pushes run it only when one
    # of the release-consistency inputs or the workflow itself changed.
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release-consistency.yml'
  # Catches the genuine "manifest bumped, tag never cut" case (v5.2.0 shipped that
  # way and went unnoticed for months) without the push-to-main run having to
  # assert a tag that cannot exist yet.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify manifest, CHANGELOG, tag, and release agree
        id: verify
        run: |
          set -uo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          GAPS=""

          # A release commit bumps the manifest BEFORE its tag exists, so asserting
          # the tag on push-to-main reported drift on every single release: nine
          # false positives (v5.2.0 through v6.0.1) were hand-closed on 2026-08-14,
          # and one genuine finding (v5.2.0 was never tagged at all) sat buried
          # among them for months. The assertion now runs only where a tag can
          # legitimately already exist -- the tag push itself, the daily schedule,
          # and manual dispatch -- so a firing means real drift.
          CHECK_TAG=1
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            CHECK_TAG=0
          fi
          echo "checked_tag=$CHECK_TAG" >> "$GITHUB_OUTPUT"

          if ! grep -qE "^### v${VERSION//./\\.}( |\$)" CHANGELOG.md; then
            GAPS="$GAPS
          - .claude-plugin/plugin.json's version ($VERSION) has no matching '### v$VERSION' heading in CHANGELOG.md"
          fi

          if [ "$CHECK_TAG" = "1" ]; then
            if ! git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
              GAPS="$GAPS
          - no git tag v$VERSION exists for the current plugin.json version"
            fi
          else
            echo "Tag assertion skipped: push-to-main runs before the release tag exists." >> "$GITHUB_STEP_SUMMARY"
          fi

          # marketplace.json carries no independent version by design (AGENTS.md: the
          # version lives ONLY in plugin.json) -- what CAN drift is its plugin entry's
          # name/source no longer resolving to this same manifest.
          PLUGIN_NAME=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['name'])")
          MARKETPLACE_OK=$(python3 -c "
          import json
          manifest = json.load(open('.claude-plugin/plugin.json'))
          marketplace = json.load(open('.claude-plugin/marketplace.json'))
          plugins = marketplace.get('plugins', [])
          match = next((p for p in plugins if p.get('name') == manifest['name']), None)
          print('yes' if match and match.get('source') == './' else 'no')
          ")
          if [ "$MARKETPLACE_OK" != "yes" ]; then
            GAPS="$GAPS
          - marketplace.json has no plugin entry named '$PLUGIN_NAME' with source './' matching plugin.json's name"
          fi

          if [ -n "$GAPS" ]; then
            echo "gaps<<GAPEOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$GAPS" >> "$GITHUB_OUTPUT"
            echo "GAPEOF" >> "$GITHUB_OUTPUT"
            echo "### Release consistency: DRIFT" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$GAPS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Release consistency: clean (v$VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        env:
          version: ${{ steps.verify.outputs.version }}
          gaps: ${{ steps.verify.outputs.gaps }}
        with:
          script: |
            const version = process.env.version || 'unknown'
            const gaps = process.env.gaps || '(no detail captured)'
            const title = `Release consistency drift on v${version}`

            // F086: this workflow runs on every push to main. Without a dedupe
            // check, repeated pushes while a release is mid-flight (tag not yet
            // created) would open one issue per push -- check for an existing
            // open issue with the same title first. per_page: 100 (the API
            // default is 30) and filtering out pull requests (listForRepo
            // returns both, distinguished by the presence of `pull_request`)
            // keeps the drift issue from falling off the page behind unrelated
            // open issues/PRs.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const openIssues = existing.data.filter((issue) => !issue.pull_request)
            if (openIssues.some((issue) => issue.title === title)) {
              console.log(`An open issue titled "${title}" already exists -- skipping creation.`)
              return
            }

            const body = [
              `.claude-plugin/plugin.json currently records version ${version}, but this`,
              'check found a gap between the manifest, CHANGELOG.md, and the git tag:',
              '',
              gaps,
              '',
              'This is the release-desync failure mode OVI-103 was filed for: users on',
              '`/plugin update` only receive a version once the manifest is bumped, so a',
              'bumped manifest with no matching tag/release/changelog entry means the',
              'published state and main have drifted apart. Fix by completing whichever',
              'release step was skipped (CHANGELOG entry, git tag, or GitHub release).',
              '',
              'Once that step is completed this issue closes itself: the next run that',
              'performs the full check (the tag push, the daily schedule, or a manual',
              'dispatch) and finds no gaps will close it with a comment.',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })

      # Self-healing: a full check that finds no gaps closes the drift issue it
      # (or an earlier run) opened. Gated on checked_tag so a clean push-to-main
      # run -- which deliberately skipped the tag assertion -- can never close an
      # issue reporting a missing tag it did not look for.
      - name: Close a cleared drift issue
        if: success() && steps.verify.outputs.checked_tag == '1'
        uses: actions/github-script@v7
        env:
          version: ${{ steps.verify.outputs.version }}
        with:
          script: |
            const version = process.env.version || 'unknown'
            const title = `Release consistency drift on v${version}`
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const match = existing.data
              .filter((issue) => !issue.pull_request)
              .find((issue) => issue.title === title)
            if (!match) {
              console.log(`No open issue titled "${title}" -- nothing to close.`)
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `Closed automatically: the full release-consistency check passed for v${version}`,
                `(run ${context.runId}, event \`${context.eventName}\`), so the gap this issue`,
                'reported has cleared.',
              ].join('\n'),
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            })
