name: maintenance

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # F078/OVI-103 review (PR #137, round 1): keep full history here too, so
      # this workflow's run of test/run-tests.sh never regresses into the
      # shallow-clone/no-tags failure test.yml hit -- see that file's checkout
      # step for the incident this guards against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install latest Claude Code CLI (retry once on flake)
        id: install
        run: |
          npm install -g @anthropic-ai/claude-code \
            || (sleep 10 && npm install -g @anthropic-ai/claude-code)

      - name: Record probed CLI version
        id: record_version
        run: |
          echo "cli_version=$(claude --version)" >> "$GITHUB_ENV"
          {
            echo "### Maintenance probe"
            echo "Claude Code CLI version: $(claude --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run test suite
        id: tests
        run: bash test/run-tests.sh

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          install_outcome: ${{ steps.install.outcome }}
          record_version_outcome: ${{ steps.record_version.outcome }}
          tests_outcome: ${{ steps.tests.outcome }}
        with:
          script: |
            const version = process.env.cli_version || 'unknown version'
            const failingSection =
              process.env.install_outcome === 'failure' ? 'CLI install' :
              process.env.record_version_outcome === 'failure' ? 'CLI version probe' :
              process.env.tests_outcome === 'failure' ? 'test suite' :
              'unknown step'
            const body = [
              'The weekly maintenance cron failed. Check the workflow run logs',
              'for the failing section (CLI install or test suite) and the job',
              'summary for the probed CLI version. See',
              'docs/maintenance-runbook.md for the full probe checklist.',
            ].join(' ')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance probe failed on Claude Code ${version} (${failingSection})`,
              body,
            })
